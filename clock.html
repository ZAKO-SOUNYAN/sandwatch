<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1a1a; --fg: #ffffff; --fg50: rgba(255,255,255,0.4);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f5f5; --fg: #111111; --fg50: rgba(0,0,0,0.35); }
  }
  body {
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
    overflow: hidden;
  }
  .container {
    display: flex; align-items: flex-start; gap: 1.6rem;
  }
  #hg-wrap { width: 48px; flex-shrink: 0; }
  #hg-svg  { display: block; width: 100%; transform-origin: 50% 50%; }

  .clock-block { display: flex; flex-direction: column; }
  .time-row { display: flex; align-items: baseline; line-height: 1; }
  .digit, .colon {
    font-size: clamp(2rem, 6.5vw, 3.4rem);
    font-weight: 300; color: var(--fg);
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .colon { margin: 0 3px; }
  .date-row {
    margin-top: 0.3em;
    font-weight: 300;
    font-size: clamp(0.67rem, 2.17vw, 1.13rem);
    letter-spacing: 0.15em; color: var(--fg50); line-height: 1;
  }
</style>
</head>
<body>
<div class="container">

  <div id="hg-wrap">
    <!--
      砂時計の形状 (viewBox 0 0 60 110):
      ・上下に楕円のバルブ（丸みのある膨らみ）
      ・中央にくびれ（ネック）
      ・全体をひとつのパスで描き、clipPath でサンドをくり抜く

      アウトライン（外枠）:
        上端キャップ: 左右に丸みのある横棒
        左上曲線: 外側に膨らみ、中央くびれへ
        右上曲線: 同様
        くびれ: 細い通路
        左下曲線: くびれから外側に膨らみ
        右下曲線: 同様
        下端キャップ: 丸み
    -->
    <svg id="hg-svg" viewBox="0 0 60 110" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!--
          砂時計内部領域のクリップパス
          上室: 上端(y≈8)から中央くびれ(y=55)
          下室: くびれ(y=55)から下端(y≈102)
          左右は外枠の内側に沿った曲線
        -->
        <clipPath id="clip-hg">
          <!-- 内側パス (外枠より少し内側) -->
          <path d="
            M 10,10
            Q 10,8  30,8
            Q 50,8  50,10
            C 50,14  44,30  33,52
            Q 31,55  30,55
            Q 29,55  27,52
            C 16,30  10,14  10,10
            Z
            M 10,100
            Q 10,102 30,102
            Q 50,102 50,100
            C 50,96  44,80  33,58
            Q 31,55  30,55
            Q 29,55  27,58
            C 16,80  10,96  10,100
            Z
          "/>
        </clipPath>
      </defs>

      <!-- 砂時計の外枠シルエット（細めのストローク） -->
      <!-- 上室アーチ -->
      <path d="
        M 8,9
        Q 8,4  30,4
        Q 52,4  52,9
        C 52,18  45,34  33,53
        Q 31.5,56  30,56
        Q 28.5,56  27,53
        C 15,34  8,18  8,9
        Z
      " fill="none" stroke-width="1.8" stroke-linejoin="round"
         style="stroke:var(--fg); opacity:0.35; fill:none"/>

      <!-- 下室アーチ -->
      <path d="
        M 8,101
        Q 8,106 30,106
        Q 52,106 52,101
        C 52,92  45,76  33,57
        Q 31.5,54  30,54
        Q 28.5,54  27,57
        C 15,76  8,92  8,101
        Z
      " fill="none" stroke-width="1.8" stroke-linejoin="round"
         style="stroke:var(--fg); opacity:0.35; fill:none"/>

      <!-- くびれ部分の横線（細いネック強調） -->
      <line x1="27" y1="55" x2="33" y2="55"
            stroke-width="1.2" style="stroke:var(--fg); opacity:0.2"/>

      <!-- ── 砂 ── クリップパスで砂時計形状に収める -->

      <!-- 上室の砂 (rect を clip で三角形に近い形に): y が下がるにつれ砂が減る -->
      <rect id="sand-top"
        x="0" y="4" width="60" height="52"
        clip-path="url(#clip-hg)"
        style="fill:var(--fg); opacity:0.72"/>

      <!-- 下室の砂: rect の y を上げることで底から積もる -->
      <rect id="sand-bot"
        x="0" y="110" width="60" height="0"
        clip-path="url(#clip-hg)"
        style="fill:var(--fg); opacity:0.72"/>

      <!-- 落下する砂のライン -->
      <line id="sand-stream"
        x1="30" y1="57" x2="30" y2="57"
        stroke-width="1.5"
        style="stroke:var(--fg); opacity:0"/>
    </svg>
  </div>

  <!-- 時刻 -->
  <div class="clock-block" id="clock-block">
    <div class="time-row">
      <span class="digit" id="hh">00</span>
      <span class="colon">:</span>
      <span class="digit" id="mm">00</span>
      <span class="colon">:</span>
      <span class="digit" id="ss">00</span>
    </div>
    <div class="date-row" id="date"></div>
  </div>
</div>

<script>
const DAYS = ['日','月','火','水','木','金','土'];
function pad(n){ return String(n).padStart(2,'0'); }

const sandTop    = document.getElementById('sand-top');
const sandBot    = document.getElementById('sand-bot');
const sandStream = document.getElementById('sand-stream');
const hgSvg      = document.getElementById('hg-svg');
const hgWrap     = document.getElementById('hg-wrap');
const clockBlock = document.getElementById('clock-block');

/*
  viewBox 高さ = 110
  上室砂エリア: y=4 〜 y=56  (高さ52)
  下室砂エリア: y=54 〜 y=106 (高さ52)

  上室: 砂の下端は常に y=56(ネック)固定。上端 y が下がる → 高さが減る
    ratio=0 → y=4,  height=52 (満杯)
    ratio=1 → y=56, height=0  (空)

  下室: 砂は底から積もる。rect の y を上げ height を増やす
    ratio=0 → y=110, height=0  (空)
    ratio=1 → y=54,  height=52 (満杯)
*/
function updateHourglass(sec) {
  const ratio = sec / 59;

  // 上室: topY = 4 + 52*ratio, height = 52 - 52*ratio
  const topY = 4 + 52 * ratio;
  const topH = 52 * (1 - ratio);
  sandTop.setAttribute('y', topY.toFixed(2));
  sandTop.setAttribute('height', topH.toFixed(2));

  // 下室: botY = 106 - 52*ratio, height = 52*ratio
  const botY = 106 - 52 * ratio;
  const botH = 52 * ratio;
  sandBot.setAttribute('y', botY.toFixed(2));
  sandBot.setAttribute('height', botH.toFixed(2));

  // 落下ライン: ネック(y=57) → 下室砂面(botY)
  if (sec > 0 && sec < 59) {
    sandStream.setAttribute('y2', Math.max(59, botY - 1).toFixed(1));
    sandStream.style.opacity = '0.4';
  } else {
    sandStream.style.opacity = '0';
  }
}

function syncSize() {
  const h = clockBlock.getBoundingClientRect().height;
  hgWrap.style.height = h + 'px';
  hgSvg.setAttribute('height', h);
}

let isFlipping = false;
let lastSec = -1;

function flip() {
  isFlipping = true;
  let angle = 0;
  function step() {
    angle += 5;
    hgSvg.style.transform = `rotate(${angle}deg)`;
    if (angle < 180) {
      requestAnimationFrame(step);
    } else {
      hgSvg.style.transform = 'rotate(0deg)';
      updateHourglass(0);
      isFlipping = false;
    }
  }
  requestAnimationFrame(step);
}

function tick() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
  document.getElementById('hh').textContent = pad(h);
  document.getElementById('mm').textContent = pad(m);
  document.getElementById('ss').textContent = pad(s);
  const wd = DAYS[now.getDay()];
  document.getElementById('date').textContent =
    now.getFullYear() + '.' + pad(now.getMonth()+1) + '.' + pad(now.getDate())
    + '  ' + wd + '曜日';
  if (!isFlipping) updateHourglass(s);
  if (lastSec === 59 && s === 0) flip();
  lastSec = s;
}

tick();
syncSize();
requestAnimationFrame(() => { syncSize(); });
setInterval(tick, 1000);
window.addEventListener('resize', syncSize);
</script>
</body>
</html>
